[package]
name = "tstudio-sales-panel"
version = "1.0.0"
description = "Панель управления продающим ботом Telegram Studio"
edition = "2021"

[lib]
name = "tstudio_sales_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls, not the OpenSSL backend — same reasoning as the main app
# (src-tauri/Cargo.toml): no OpenSSL to link against, and this panel only
# ever talks to api.telegram.org, so there's no need for the extra backend.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Only for tokio::time::sleep — rate-limiting the broadcast_update send loop
# without blocking a worker thread. Tauri already runs on tokio internally;
# this just gives direct access to its "time" feature.
tokio = { version = "1", features = ["time"] }
# Native process enumeration for the bot-status check — replaces spawning a
# powershell.exe + WMI (Get-CimInstance Win32_Process) query every 5s, which
# got noticeably slow on a freshly installed Windows (fresh Defender/AMSI
# re-scans every new powershell.exe launch + WMI repository not warmed up).
sysinfo = "0.32"
chrono = "0.4"

[profile.release]
panic = "abort"
