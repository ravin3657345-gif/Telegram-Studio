[package]
name = "tstudio-sales-panel"
version = "1.0.0"
description = "Панель управления продающим ботом Telegram Studio"
edition = "2021"

[lib]
name = "tstudio_sales_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
