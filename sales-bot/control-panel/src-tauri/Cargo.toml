[package]
name = "tstudio-sales-panel"
version = "1.0.0"
description = "Панель управления продающим ботом Telegram Studio"
edition = "2021"

[lib]
name = "tstudio_sales_panel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls, not the OpenSSL backend — same reasoning as the main app
# (src-tauri/Cargo.toml): no OpenSSL to link against, and this panel only
# ever talks to api.telegram.org, so there's no need for the extra backend.
# Runs inside Tauri's own async runtime, so no separate tokio dependency.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
panic = "abort"
