[workspace]
members = ["core", "tools/keygen", "tools/sales-bot-launcher"]

[package]
name = "telegram-studio"
version = "1.0.0"
edition = "2021"
authors = ["Artem Kurdov"]
default-run = "telegram-studio"

[lib]
name = "telegram_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tstudio-core = { path = "core" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
# rustls instead of the default OpenSSL-backed TLS: openssl-sys needs a real
# OpenSSL cross-compiled for each target (Android NDK has none available),
# and pure-Rust TLS works identically on Windows, so there's no reason to
# keep two backends around.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "charset", "http2"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
url = "2"

# Note: token encryption (aes-gcm/sha2/hex) and license validation live in the
# `tstudio-core` workspace crate — kept Tauri-free so their tests run without
# WebView2 linkage. See core/.

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
