name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: {}

env:
  # .cargo/config.toml and .npmrc hardcode Windows-only absolute paths
  # (D:/cargo-tgt, D:/TElega POST/.build/npm-cache) needed locally to dodge a
  # windres bug from the project's own space-containing path — see
  # project_build_path memory. On Unix those paths' bare "D:" collides with
  # ":" as the PATH-list separator ("failed to join paths from
  # $LD_LIBRARY_PATH"). Env vars override config-file values, so this
  # neutralizes both without touching the files real local dev depends on.
  CARGO_TARGET_DIR: target
  npm_config_cache: ${{ github.workspace }}/.npm-cache

jobs:
  rust-core:
    name: tstudio-core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run tstudio-core tests
        working-directory: src-tauri
        run: cargo test -p tstudio-core

  frontend:
    name: Frontend tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # Not `npm ci`: npm 11's lockfile generation marks
        # platform-incompatible optional deps (e.g. @esbuild/netbsd-arm64)
        # with "extraneous": true instead of "optional": true, so `npm ci`
        # treats them as required and fails with EBADPLATFORM on any OS
        # that isn't the one the lockfile was generated on. `npm install`
        # re-evaluates platform compatibility live instead of trusting that
        # field, and still installs from the lockfile's pinned versions.
        run: npm install

      - name: Run tests
        run: npm test
