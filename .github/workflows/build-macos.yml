name: Build macOS

# Builds the universal macOS app and — on the release branch — publishes it to
# the in-app update channel.
#
# Why this lives in Actions: a macOS bundle can only be produced on macOS, and
# the Windows release script (scripts/publish-update.ps1) cannot cross-compile
# one. Both halves write the SAME manifest in the bucket, each replacing only its
# own platform key, so neither can erase the other.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/telegram-studio.key
#                                       (the file's CONTENT, not a path; the same
#                                       key Windows signs with — a different key
#                                       is rejected by every installed copy)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  empty (the key has no password); leaving
#                                       the secret undefined also works, because
#                                       Actions then sets the variable to an empty
#                                       string, which is what tauri needs to avoid
#                                       prompting on a non-interactive runner
#   SUPABASE_SERVICE_ROLE_KEY           service_role key, for Storage writes
#
# Without the signing key the build fails outright: bundle.createUpdaterArtifacts
# is true, and Tauri refuses to produce unsigned updater artifacts.

on:
  workflow_dispatch: {}

env:
  # See test.yml for why these override .cargo/config.toml and .npmrc's
  # Windows-only absolute paths (they break on Unix's ":" path-list separator).
  CARGO_TARGET_DIR: target
  npm_config_cache: ${{ github.workspace }}/.npm-cache

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (arm64 + x86_64 targets for a universal build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        # See test.yml for why `npm ci` is avoided here (npm 11 lockfile bug
        # with cross-platform optional deps like @esbuild/*).
        run: npm install

      - name: Build universal macOS app (.app + .dmg + updater .tar.gz)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin

      - name: Smoke test — launch the built app
        # No real Mac is available to click through the app by hand, so this
        # is the closest thing to "does it even open" verification: run the
        # bundle's actual binary directly (not via `open`/Finder, so a fresh
        # local build has no com.apple.quarantine xattr to trip Gatekeeper on)
        # and confirm the process is still alive a few seconds later instead
        # of having crashed immediately (missing dylib, bad code signature,
        # panic during startup init, etc.).
        timeout-minutes: 2
        run: |
          set -e
          APP_PATH=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -n1)
          echo "App bundle: $APP_PATH"
          BINARY_NAME=$(ls "$APP_PATH/Contents/MacOS")
          BINARY_PATH="$APP_PATH/Contents/MacOS/$BINARY_NAME"
          echo "Binary: $BINARY_PATH"

          "$BINARY_PATH" > app-smoke-test.log 2>&1 &
          PID=$!
          sleep 5

          if kill -0 "$PID" 2>/dev/null; then
            echo "App still running after 5s (PID $PID) — looks healthy."
            kill "$PID"
          else
            echo "::error::App exited/crashed within 5s of launch"
            wait "$PID" 2>/dev/null || true
            echo "--- stdout/stderr ---"
            cat app-smoke-test.log || true
            echo "--- recent crash reports ---"
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 \( -name "*.crash" -o -name "*.ips" \) -newer "$APP_PATH" -exec cat {} \; 2>/dev/null || true
            exit 1
          fi

      - name: Upload smoke test log (only if it failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-test-log
          path: app-smoke-test.log
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TelegramStudio-macOS-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Publish to the update channel
        # Only from the default branch: an update published from a feature
        # branch would go straight to every installed copy, and only versions
        # above the installed one are ever offered — so that mistake cannot be
        # taken back by publishing a smaller number.
        if: github.ref_name == github.event.repository.default_branch
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/publish-macos.mjs
