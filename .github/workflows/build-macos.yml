name: Build macOS

on:
  workflow_dispatch: {}

env:
  # See test.yml for why these override .cargo/config.toml and .npmrc's
  # Windows-only absolute paths (they break on Unix's ":" path-list separator).
  CARGO_TARGET_DIR: target
  npm_config_cache: ${{ github.workspace }}/.npm-cache

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (arm64 + x86_64 targets for a universal build)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build universal macOS app (.app + .dmg)
        run: npx tauri build --target universal-apple-darwin

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TelegramStudio-macOS-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
